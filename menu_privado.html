<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV-IPTV Futurista</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  background:black;
  color:#fff;
  overflow-x:hidden;
}

/* CANVAS */
#particles{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,255,255,.2);
}

.logo{
  display:flex;
  align-items:center;
}

.logo img{
  height:45px;
  margin-right:10px;
}

.logo strong{
  font-size:20px;
  color:#00f7ff;
  text-shadow:0 0 10px #00f7ff;
}

/* GRID */
.main{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:25px;
  padding:40px;
}

/* CARDS */
.card{
  position:relative;
  height:190px;
  background:rgba(15,23,42,.6);
  border-radius:20px;
  backdrop-filter:blur(8px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-decoration:none;
  color:white;
  overflow:hidden;
  border:1px solid rgba(0,255,255,.2);
  transition:.3s ease;
}

.card::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:linear-gradient(
    45deg,
    transparent,
    rgba(0,255,255,.15),
    transparent
  );
  transform:rotate(45deg);
  animation:shine 6s linear infinite;
}

@keyframes shine{
  0%{transform:translateX(-100%) rotate(45deg);}
  100%{transform:translateX(100%) rotate(45deg);}
}

.card:hover,
.card:focus{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 0 25px rgba(0,255,255,.5);
  outline:none;
}

.card img{
  width:65px;
  margin-bottom:10px;
  filter:drop-shadow(0 0 10px cyan);
  z-index:2;
}

.card span{
  font-size:18px;
  font-weight:bold;
  z-index:2;
  text-align:center;
  padding:0 10px;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="top-bar">
  <div class="logo">
    <img src="https://imgur.com/Nl0wJJt.png">
    <strong>DEV-IPTV</strong>
  </div>
</div>

<div class="main">

  <a href="https://miguel179-spe.github.io/tvlion/" class="card">
    <img src="https://imgur.com/FCuUQdp.png">
    <span>TV EN VIVO</span>
  </a>

  <a href="/ir/3" class="card">
    <img src="https://imgur.com/bJ7WpCr.png">
    <span>PELÍCULAS</span>
  </a>

  <a href="https://appropriate-miquela-gr4u-fac2aa5d.koyeb.app/" class="card">
    <img src="https://imgur.com/BuAhDFU.png">
    <span>SERIES</span>
  </a>

  <a href="/ir/6" class="card">
    <img src="https://imgur.com/S9JuDJI.png">
    <span>RADIO</span>
  </a>

  <a href="/ir/8" class="card">
    <img src="https://imgur.com/OM0sDRI.png">
    <span>XXX</span>
  </a>

  <a href="/ir/10" class="card">
    <img src="https://imgur.com/pTdMDr5.png">
    <span>DEPORTES EN VIVO</span>
  </a>

  <a href="/ir/5" class="card">
    <img src="https://imgur.com/SJ7FVKn.png">
    <span>TRANSMISION EN VIVO</span>
  </a>

  <a href="/ir/11" class="card">
    <img src="https://imgur.com/JVXcJoM.png">
    <span>BEIBOL DOMINICANO</span>
  </a>

</div>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();

let particles = [];

for(let i=0;i<120;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*2,
    speedX:(Math.random()-0.5)*0.5,
    speedY:(Math.random()-0.5)*0.5
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="white";

  particles.forEach(p=>{

    p.x += p.speedX;
    p.y += p.speedY;

    if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
    if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",resizeCanvas);
</script>

</body>
</html>
